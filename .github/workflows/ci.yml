name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        run: |
          if [ -f ci/check.sh ]; then
            bash ci/check.sh
          else
            echo ok
          fi
